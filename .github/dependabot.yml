# Dependabot for emailops/2.4-panic-free, the fork's default branch.
# The branch keeps no Cargo.lock: EmailOps' own lock picks patch and minor
# versions. So the cargo pull requests here are requirement bumps (imap-proto,
# nom, base64...), and most need porting work before CI passes.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
